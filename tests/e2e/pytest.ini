[pytest]
# L4 (marker e2e) and L5 (marker contract) suites; see README.md.
testpaths = .
markers =
    e2e: L4, the bridge container against the Donetick stub (profile stub)
    contract: L5, a real Donetick (profile contract)
    slow: takes a minute or more of real time (retry delays)
addopts = -ra --strict-markers
