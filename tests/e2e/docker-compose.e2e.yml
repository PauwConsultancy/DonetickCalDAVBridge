# L4 end-to-end and L5 contract environment (docs/testing-strategy.md, 5.5 and 5.6).
#
#   tests/e2e/certs/generate.sh
#   docker compose -f tests/e2e/docker-compose.e2e.yml --profile stub up -d --build --wait
#   pytest tests/e2e -m e2e
#
# Profiles: "stub" runs the bridge against the WireMock stub with the reference data; "contract" runs
# a real Donetick. The contract bridge (profile "contract-bridge") needs an API key that the tests
# provision first; they start it with DONETICK_API_KEY set.
name: donetick-caldav-e2e

x-bridge-build: &bridge-build
  context: ../..
  dockerfile: Dockerfile

x-bridge-environment: &bridge-environment
  CalDav__Username: e2e
  CalDav__Password: e2e-password
  CalDav__Tls__CertPath: /certs/bridge.crt
  CalDav__Tls__KeyPath: /certs/bridge.key
  Donetick__PollIntervalSeconds: "5"
  Logging__LogLevel__DonetickCalDav: Debug

services:
  donetick-stub:
    profiles: [stub]
    build: ./stub
    volumes:
      - ../fixtures/donetick/mappings:/stub/__admin/mappings:ro
    ports:
      - "9091:9091"

  bridge:
    profiles: [stub]
    build: *bridge-build
    image: donetick-caldav:e2e
    environment:
      <<: *bridge-environment
      Donetick__BaseUrl: http://donetick-stub:9091
      Donetick__ApiKey: test-api-key
    volumes:
      - ./certs/out:/certs:ro
    ports:
      - "5232:5232"
    depends_on:
      donetick-stub:
        condition: service_healthy

  bridge-labels:
    profiles: [stub]
    build: *bridge-build
    image: donetick-caldav:e2e
    environment:
      <<: *bridge-environment
      Donetick__BaseUrl: http://donetick-stub:9091
      Donetick__ApiKey: test-api-key
      CalDav__GroupByLabel: "true"
    volumes:
      - ./certs/out:/certs:ro
    ports:
      - "5233:5232"
    depends_on:
      donetick-stub:
        condition: service_healthy

  donetick:
    profiles: [contract]
    build:
      context: ./donetick
    ports:
      - "2021:2021"

  bridge-contract:
    profiles: [contract-bridge]
    build: *bridge-build
    image: donetick-caldav:e2e
    environment:
      <<: *bridge-environment
      Donetick__BaseUrl: http://donetick:2021
      Donetick__ApiKey: ${DONETICK_API_KEY:-not-provisioned}
    volumes:
      - ./certs/out:/certs:ro
    ports:
      - "5234:5232"
