# Weekly mutation testing of the core logic with Stryker.NET (docs/testing-strategy.md, 5.8):
# checks that the unit tests actually catch changes to the mapping, resolver, path and cache code.
name: Mutation testing

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker.NET on the core logic
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker --version 5.0.0

      - name: Run mutation testing (fails below the break threshold in stryker-config.json)
        working-directory: tests/mutation
        run: dotnet stryker --config-file stryker-config.json --output "$GITHUB_WORKSPACE/artifacts/mutation"

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          report=artifacts/mutation/reports/mutation-report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: artifacts/mutation/reports
          if-no-files-found: ignore
