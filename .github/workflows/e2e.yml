# L4 container end-to-end tests: the image built from the Dockerfile, against the WireMock stub with
# the reference data, driven by the Python caldav client over HTTPS (docs/testing-strategy.md, 5.5).
name: End-to-end

on:
  schedule:
    - cron: "17 3 * * *" # nightly
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Container end-to-end (stub)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f tests/e2e/docker-compose.e2e.yml --profile stub
      E2E_ENV: compose
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test runner
        run: pip install -r tests/e2e/requirements.txt

      - name: Create test certificates
        run: tests/e2e/certs/generate.sh

      - name: Build and start bridge and stub
        run: $COMPOSE up -d --build --wait

      - name: Run end-to-end tests
        run: pytest tests/e2e -m e2e --junitxml=artifacts/e2e-results.xml

      - name: Test summary
        if: ${{ !cancelled() }}
        run: python3 tests/ci/junit_summary.py artifacts

      - name: Container logs
        if: ${{ failure() }}
        run: $COMPOSE logs --no-color

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: artifacts/e2e-results.xml
          if-no-files-found: ignore

      - name: Stop containers
        if: ${{ always() }}
        run: $COMPOSE down -v
